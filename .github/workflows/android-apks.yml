name: Build Android APKs
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both debug APKs
        run: gradle --no-daemon assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: village-trust-fund-apks
          path: |
            collector/build/outputs/apk/debug/*.apk
            supervisor/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
